# ====================================================================
# QUADRUPED SELF-RECOVERY CONFIG - UNITREE GO2 + MUJOCO
# Based on: "Self-Recovery of Quadrupedal Robot Using DRL" (2024)
# Robot: Unitree Go2 (instead of A1)
# Simulator: MuJoCo (instead of PyBullet)
# ====================================================================

# ==================== ROBOT CONFIGURATION ====================
robot:
  name: "unitree_go2"

  # MuJoCo model path
  # Using model from root project directory
  model_path: "../../go2-sr-ppo-dl/environment/assets/unitree_go2/scene.xml"
  urdf_path: "../../go2-sr-ppo-dl/environment/assets/unitree_go2/go2.urdf"

  num_joints: 12

  # Heights (from paper Fig. 3)
  # Note: Go2 dimensions may differ slightly from A1
  max_height: 0.34 # Paper: "0.34 meter is the max height"
  target_height: 0.27 # Paper: "threshold at 0.31 meter"

# ==================== OBSERVATION SPACE ====================
# Extended observation: 36-dimensional observation
observation:
  size: 36
  components:
    joint_positions: 12 # indices 0-11
    joint_velocities: 12 # indices 12-23
    base_orientation: 3 # indices 24-26 (θ_B = R^-1 · g)
    base_angular_velocity: 3 # indices 27-29
    center_of_mass_position: 3 # indices 30-32 (COM in base frame)
    center_of_mass_velocity: 3 # indices 33-35 (COM velocity in base frame)

  # Add sensor noise (paper: "to replicate real robot")
  add_noise: true
  noise:
    joint_positions: 0.1 # ±0.1 rad
    joint_velocities: 1.0 # ±1.0 rad/s
    base_angular_velocity: 0.2 # ±0.2 rad/s
    com_position: 0.01 # ±1 cm
    com_velocity: 0.1 # ±0.1 m/s

  # Normalization ranges (eq. 7: map to [-1, 1])
  # These are defaults - run extract_go2_params.py to get exact values
  normalization:
    joint_pos_min: -3.14
    joint_pos_max: 3.14
    joint_vel_min: -30.0
    joint_vel_max: 30.0
    base_orient_min: -1.0 # Already normalized (unit vector)
    base_orient_max: 1.0
    base_ang_vel_min: -10.0
    base_ang_vel_max: 10.0
    com_pos_min: [-0.5, -0.5, -0.5]
    com_pos_max: [0.5, 0.5, 0.5]
    com_vel_min: [-3.0, -3.0, -3.0]
    com_vel_max: [3.0, 3.0, 3.0]

# ==================== ACTION SPACE ====================
# Paper: "12 nodes, each representing the joint position command"
action:
  size: 12
  type: "continuous"
  range: [-1.0, 1.0] # Normalized, then rescaled to joint limits
  smoothing: 0.35 # REDUCED - allows faster, more explosive movements for rolling
  scale: 1.0 # FULL joint range - robot needs full motion to flip over

# ==================== PD CONTROLLER ====================
# Paper Fig. 1: Policy outputs target positions to PD controller
controller:
  type: "pd"
  kp: 60.0 # Position gain - HIGH for explosive roll movements
  kd: 6.5 # Derivative gain - LOWER to allow faster motion
  # max_torque removed - now uses MuJoCo model limits per actuator
  # Hip/Thigh: 23.7 Nm, Knee(calf): 45.43 Nm
  post_recovery_torque:
    enabled: true
    success_uprightness: 0.90     # Consider SR complete when base is mostly upright
    recovery_scale: 1.0           # Full torque while self-righting
    transition_scale: 0.55        # Reduced torque once upright but still settling
    hold_scale: 0.25              # Low-torque holding when upright and stable
    low_base_vel_threshold: 0.22  # m/s
    low_joint_vel_threshold: 1.2  # rad/s
    position_deadband_rad: 0.03   # Avoid micro-corrections in stable pose
    velocity_deadband: 0.60       # rad/s

# ==================== REWARD FUNCTION ====================
# Paper Table II & III, Eq. (9)
# IMPORTANT: All individual rewards are now in [0,1] range
reward:
  weights:
    # Always active rewards
    w1: 0.3 # R_h: Height reward
    w2: 0.3 # R_g: Orientation reward
    # Curriculum rewards (only when R_g > threshold)
    w3: 0.3 # R_h_cl: Height reward again
    w4: 0.6 # R_jp: Joint position reward
    w5: 0.1 # R_fc: Foot contact reward
    # Smoothness/regularization - INCREASED to penalize jerky movements
    w6: 0.05 # R_ad: Action difference (HIGH - smooth actions)
    w7: 0.005 # R_v: Joint velocity cost (penalize fast joint movements)
    w8: 0.05   # R_vb: Base linear velocity 
    w9: 0.08    # R_jitter_contact: penalize foot contact state switching (too high can induce stiffness)
    w10: 0.0    # R_touchdown_contact: currently disabled in total reward
    w11: 1.60   # R_4fc_duration_exp: strong bonus for sustained 4-feet contact
    w12: 0.45   # R_stability: support polygon + inscribed-circle CoM safety reward
    w13: 0.35   # R_ellipse_posture: auxiliary posture shaping (kept below 4-feet support)
    w14: 0.20   # R_torque_efficiency: encourage lower average torque usage
    w15: 0.15   # R_post_recovery_relax: reward low torque after successful SR
  contact_duration:
    foot_alpha: 0.06      # R_fc_duration_exp = mean(1 - exp(-foot_alpha * streak_i))
    all_feet_alpha: 0.25  # R_4fc_duration_exp = 1 - exp(-all_feet_alpha * streak_4fc)
  stabilizer:
    com_projection_radius: 0.05   # Effective projected CoM safety radius (meters)
    target_polygon_area: 0.03     # Target support area to saturate area term
    target_incircle_radius: 0.09  # Target inscribed-circle radius to saturate circle term
    streak_alpha: 0.03            # Time persistence gain for sustained stability
    position_weight: 0.45         # Margin to safe circle edge
    incircle_weight: 0.25         # Encourage larger inscribed circle
    area_weight: 0.20             # Encourage larger support polygon (e.g. near rectangular stance)
    time_weight: 0.10             # Encourage longer stable stance durations
  ellipse_posture:
    enabled: true                 # Enable ellipse posture regularization
    enabled_only_with_4_contacts: false # Compute whenever there is contact (not only 4 paws)
    min_contacts: 3               # Require at least tripod support for ellipse reward
    b_target: 0.07                # Target minor semi-axis (lateral width, meters); lower narrows leg spacing
    ke: 12.0                      # Higher gain: much larger reward when close to ellipse
  torque:
    efficiency_alpha: 3.0         # Higher -> stronger penalty for average torque utilization
    hold_relax_gain: 1.0          # Gain for post-recovery low-torque holding reward
  curriculum:
    enabled: true
    orientation_threshold: 0.4

ppo:
  batch_size: 32
  learning_rate: 3.3e-4
  gamma: 0.97
  ent_coef: 2.0e-5
  gae_lambda: 0.95
  vf_coef: 0.3
  max_grad_norm: 0.7
  n_steps: 1024
  n_epochs: 10
  clip_range: 0.2
  policy_kwargs:
    net_arch: [256, 256, 16]
    activation_fn: "relu"
  verbose: 1
  tensorboard_log: "./logs/"

sac:
  learning_rate: 0.0004264682607738638
  buffer_size: 1000000
  learning_starts: 5000
  batch_size: 128
  tau: 0.00309583124658257
  gamma: 0.9625674561710845
  train_freq: 2
  gradient_steps: 8
  ent_coef: "auto"
  target_update_interval: 1
  target_entropy: "auto"
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: "relu"
  verbose: 1
  tensorboard_log: "./logs/"

trpo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  cg_max_steps: 15
  cg_damping: 0.1
  line_search_shrinking_factor: 0.8
  line_search_max_iter: 10
  n_critic_updates: 10
  target_kl: 0.01
  policy_kwargs:
    net_arch: [256, 256, 128]
    activation_fn: "relu"
  verbose: 1
  tensorboard_log: "./logs/"

# ==================== CMA-ES CONFIGURATION ====================
# Covariance Matrix Adaptation Evolution Strategy
# Evolves neural network weights directly (gradient-free)
cma_es:
  # Population size per generation (lambda)
  # Larger = better exploration but slower per generation
  population_size: 64

  # Number of episodes to evaluate each candidate
  # More episodes = more robust fitness estimate but slower
  n_eval_episodes: 3

  # Maximum number of generations
  max_generations: 500

  # Initial step size (standard deviation)
  # Larger = more exploration at start
  sigma0: 0.5

  # Neural network hidden layer sizes
  hidden_sizes: [128, 128]

  # Save checkpoint every N generations
  save_freq: 10

  # Number of parallel workers for evaluation (1 = sequential)
  num_workers: 1

  # Stop early if reward exceeds this (null = no early stopping)
  target_reward: null

  # Random seed for reproducibility
  seed: 42

  # Parameter bounds (null = unbounded)
  # param_bounds: [-5.0, 5.0]


training:
  ppo_profile: "ppo"
  num_parallel_envs: 12
  max_episode_steps: 512
  max_spawn_retries: 6
  spawn_xy_jitter: 0.35
  spawn_max_penetration: 0.02
  spawn_max_contacts: 40
  drop_height: 0.5
  random_orientation: true
  random_joint_positions: true
  total_episodes: 300
  # ---- Recovery curriculum ----
  # "prone" start: robot is born belly-DOWN in a crouched stance, feet under
  # the body, only needing to push up to stand. Makes the standing reward
  # gradient discoverable instead of requiring the hard belly-up flip.
  # prone_start_prob = fraction of episodes that use the easy prone start.
  recovery_curriculum:
    enabled: true
    prone_start_prob: 1.0   # 1.0 = always easy start; lower it later to mix in hard flips
    prone_spawn_lift: 0.22  # extra height (m) added at prone spawn so crouched legs clear the terrain
  total_timesteps_ppo: 3_686_400
  total_timesteps_trpo: 3_686_400
  total_timesteps_sac: 3_686_400
  save_freq: 100_000
  eval_freq: 25_000
  n_eval_episodes: 10
  log_interval: 5
  early_termination:
    enabled: true
    min_steps_before_check: 80
    patience_steps: 120
    min_improvement: 0.02
    success_score_threshold: 0.8

terrain_curriculum:
  enabled: true
  mode: "stages"
  default_terrain: "flat"
  # Ordered curriculum:
  # 1) flat -> 2) flat_inclined -> 3) rough -> 4) rocky -> 5) rocky_inclined
  # Each stage samples all levels of that terrain family.
  stages:
    - until_progress: 0.20
      weights:
        flat: 1.0

    - until_progress: 0.40
      weights:
        flat_inclined_l0: 1.0
        flat_inclined_l1: 1.0
        flat_inclined_l2: 1.0
        flat_inclined_l3: 1.0
        flat_inclined_l4: 1.0
        flat_inclined_l5: 1.0
        flat_inclined_l6: 1.0
        flat_inclined_l7: 1.0
        flat_inclined_l8: 1.0

    - until_progress: 0.60
      weights:
        rough_l0: 1.0
        rough_l1: 1.0
        rough_l2: 1.0
        rough_l3: 1.0
        rough_l4: 1.0
        rough_l5: 1.0
        rough_l6: 1.0
        rough_l7: 1.0
        rough_l8: 1.0

    - until_progress: 0.80
      weights:
        rocky_l0: 1.0
        rocky_l1: 1.0
        rocky_l2: 1.0
        rocky_l3: 1.0
        rocky_l4: 1.0
        rocky_l5: 1.0
        rocky_l6: 1.0
        rocky_l7: 1.0
        rocky_l8: 1.0
        rocky_l9: 1.0

    - until_progress: 1.00
      weights:
        rocky_inclined_l0: 1.0
        rocky_inclined_l1: 1.0
        rocky_inclined_l2: 1.0
        rocky_inclined_l3: 1.0
        rocky_inclined_l4: 1.0
        rocky_inclined_l5: 1.0
        rocky_inclined_l6: 1.0
        rocky_inclined_l7: 1.0
        rocky_inclined_l8: 1.0
        rocky_inclined_l9: 1.0
  
simulation:
  engine: "mujoco"
  n_substeps: 10  
  early_termination: false
paths:
  checkpoints: "./checkpoints/"
  logs: "./logs/"
  videos: "./videos/"

# ==================== Q-DECOMPOSITION SAC ====================
# Implements Russell & Zimdars (2003) Q-decomposition for continuous actions.
# Each reward component has its own pair of Q-networks (double-Q trick).
# The shared actor maximises sum of all sub-Q-values (arbitrator).
qdecomp:
  learning_rate: 3.0e-4
  buffer_size: 1_000_000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  learning_starts: 5000
  train_freq: 1
  gradient_steps: 1
  target_entropy: "auto"
  hidden_sizes: [256, 256]
  use_state_masks: true
  total_timesteps: 3_000_000
  eval_freq: 25_000
  n_eval_episodes: 5
  save_freq: 100_000

# ==================== Q-DECOMPOSITION PPO ====================
# On-policy equivalent of Q-decomposition.
# N value heads V_j(s), GAE per component, policy gradient on Σ A_j.
qdecomp_ppo:
  learning_rate: 1.0e-4     # was 3e-4 — slower updates reduce policy oscillation
  n_steps: 2048
  batch_size: 256
  n_epochs: 5               # was 10 — fewer epochs per rollout prevents over-fitting
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  vf_coef: 0.5
  ent_coef: 1.0e-5          # was 1e-3 — entropy bonus was driving log_std to LOG_STD_MAX
  max_grad_norm: 0.5
  hidden_sizes: [256, 256]
  total_timesteps: 3_000_000
  eval_freq: 25_000
  n_eval_episodes: 5
  save_freq: 100_000