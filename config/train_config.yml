# ====================================================================
# QUADRUPED SELF-RECOVERY CONFIG - UNITREE GO2 + MUJOCO
# Based on: "Self-Recovery of Quadrupedal Robot Using DRL" (2024)
# Robot: Unitree Go2 (instead of A1)
# Simulator: MuJoCo (instead of PyBullet)
# ====================================================================

# ==================== ROBOT CONFIGURATION ====================
robot:
  name: "unitree_go2"

  # MuJoCo model path
  # Using model from root project directory
  model_path: "../../go2-sr-ppo-dl/environment/assets/unitree_go2/scene.xml"
  urdf_path: "../../go2-sr-ppo-dl/environment/assets/unitree_go2/go2.urdf"

  num_joints: 12

  # Heights (from paper Fig. 3)
  # Note: Go2 dimensions may differ slightly from A1
  max_height: 0.34 # Paper: "0.34 meter is the max height"
  target_height: 0.27 # Paper: "threshold at 0.31 meter"

# ==================== OBSERVATION SPACE ====================
# Paper Table I: 30-dimensional observation
observation:
  size: 30
  components:
    joint_positions: 12 # indices 0-11
    joint_velocities: 12 # indices 12-23
    base_orientation: 3 # indices 24-26 (θ_B = R^-1 · g)
    base_angular_velocity: 3 # indices 27-29

  # Add sensor noise (paper: "to replicate real robot")
  add_noise: true
  noise:
    joint_positions: 0.1 # ±0.1 rad
    joint_velocities: 1.0 # ±1.0 rad/s
    base_angular_velocity: 0.2 # ±0.2 rad/s

  # Normalization ranges (eq. 7: map to [-1, 1])
  # These are defaults - run extract_go2_params.py to get exact values
  normalization:
    joint_pos_min: -3.14
    joint_pos_max: 3.14
    joint_vel_min: -30.0
    joint_vel_max: 30.0
    base_orient_min: -1.0 # Already normalized (unit vector)
    base_orient_max: 1.0
    base_ang_vel_min: -10.0
    base_ang_vel_max: 10.0

# ==================== ACTION SPACE ====================
# Paper: "12 nodes, each representing the joint position command"
action:
  size: 12
  type: "continuous"
  range: [-1.0, 1.0] # Normalized, then rescaled to joint limits
  smoothing: 0.35 # REDUCED - allows faster, more explosive movements for rolling
  scale: 1.0 # FULL joint range - robot needs full motion to flip over

# ==================== PD CONTROLLER ====================
# Paper Fig. 1: Policy outputs target positions to PD controller
controller:
  type: "pd"
  kp: 60.0 # Position gain - HIGH for explosive roll movements
  kd: 6.5 # Derivative gain - LOWER to allow faster motion
  # max_torque removed - now uses MuJoCo model limits per actuator
  # Hip/Thigh: 23.7 Nm, Knee(calf): 45.43 Nm

# ==================== REWARD FUNCTION ====================
# Paper Table II & III, Eq. (9)
# IMPORTANT: All individual rewards are now in [0,1] range
reward:
  weights:
    # Always active rewards
    w1: 0.3 # R_h: Height reward
    w2: 0.3 # R_g: Orientation reward
    # Curriculum rewards (only when R_g > threshold)
    w3: 0.3 # R_h_cl: Height reward again
    w4: 0.6 # R_jp: Joint position reward
    w5: 0.1 # R_fc: Foot contact reward
    # Smoothness/regularization - INCREASED to penalize jerky movements
    w6: 0.05 # R_ad: Action difference (HIGH - smooth actions)
    w7: 0.005 # R_v: Joint velocity cost (penalize fast joint movements)
    w8: 0.05   # R_vb: Base linear velocity 
  curriculum:
    enabled: true
    orientation_threshold: 0.4

paper_ppo:
  batch_size: 32
  learning_rate: 3.3e-4
  gamma: 0.97
  ent_coef: 2.0e-5
  gae_lambda: 0.95
  vf_coef: 0.3
  max_grad_norm: 0.7
  n_steps: 1024
  n_epochs: 10
  clip_range: 0.2
  policy_kwargs:
    net_arch: [256, 256, 16]
    activation_fn: "relu"
  verbose: 1
  tensorboard_log: "./logs/"

improved_ppo:
  batch_size: 256
  learning_rate: 0.00021332329186045702
  gamma: 0.9727412553508487
  ent_coef: 0.005237780203952844
  gae_lambda: 0.9138068587115054
  vf_coef: 0.15650014625945877
  max_grad_norm: 0.8549178816984591
  n_steps: 2048
  n_epochs: 20
  clip_range: 0.2789326463680452
  policy_kwargs:
    net_arch: [256, 256, 128]
    activation_fn: "relu"
  verbose: 1
  tensorboard_log: "./logs/"

sac:
  learning_rate: 0.0004264682607738638
  buffer_size: 1000000
  learning_starts: 5000
  batch_size: 128
  tau: 0.00309583124658257
  gamma: 0.9625674561710845
  train_freq: 2
  gradient_steps: 8
  ent_coef: "auto"
  target_update_interval: 1
  target_entropy: "auto"
  policy_kwargs:
    net_arch: [256, 256]
    activation_fn: "relu"
  verbose: 1
  tensorboard_log: "./logs/"

# ==================== CMA-ES CONFIGURATION ====================
# Covariance Matrix Adaptation Evolution Strategy
# Evolves neural network weights directly (gradient-free)
cma_es:
  # Population size per generation (lambda)
  # Larger = better exploration but slower per generation
  population_size: 64

  # Number of episodes to evaluate each candidate
  # More episodes = more robust fitness estimate but slower
  n_eval_episodes: 3

  # Maximum number of generations
  max_generations: 500

  # Initial step size (standard deviation)
  # Larger = more exploration at start
  sigma0: 0.5

  # Neural network hidden layer sizes
  hidden_sizes: [128, 128]

  # Save checkpoint every N generations
  save_freq: 10

  # Number of parallel workers for evaluation (1 = sequential)
  num_workers: 1

  # Stop early if reward exceeds this (null = no early stopping)
  target_reward: null

  # Random seed for reproducibility
  seed: 42

  # Parameter bounds (null = unbounded)
  # param_bounds: [-5.0, 5.0]


training:
  ppo_profile: "improved_ppo"
  num_parallel_envs: 12
  max_episode_steps: 512
  max_spawn_retries: 6
  spawn_xy_jitter: 0.35
  spawn_max_penetration: 0.02
  spawn_max_contacts: 40
  drop_height: 0.5
  random_orientation: true
  random_joint_positions: true
  total_episodes: 300
  total_timesteps_ppo: 3_686_400
  total_timesteps_sac: 3_686_400
  save_freq: 100_000
  eval_freq: 25_000
  n_eval_episodes: 10
  log_interval: 5
  early_termination:
    enabled: true
    min_steps_before_check: 80
    patience_steps: 120
    min_improvement: 0.02
    success_score_threshold: 0.8

terrain_curriculum:
  enabled: true
  mode: "dynamic_roughness"  # Use dynamic terrain generation with 29 phases
  # Phase structure (auto-generated):
  # Phases 0-8: Smooth flat terrain with progressive incline (1°..9°)
  # Phases 9-10: Roughness 0 (smooth) - without/with incline
  # Phases 11-12: Roughness 1 - without/with incline
  # ... up to ...
  # Phases 27-28: Roughness 9 (rough) - without/with incline
  # Total 29 phases (9 smooth-incline + 10 roughness × 2)
  
simulation:
  engine: "mujoco"
  n_substeps: 10  
  early_termination: false
paths:
  checkpoints: "./checkpoints/"
  logs: "./logs/"
  videos: "./videos/"